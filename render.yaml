databases:
  - name: velozity-dashboard-db
    plan: free
    databaseName: dashboard
    user: dashboard

services:
  - type: web
    name: velozity-dashboard-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: velozity-dashboard-db
          property: connectionString
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: REFRESH_TOKEN_COOKIE_NAME
        value: refresh_token
      - key: OVERDUE_CRON_SCHEDULE
        value: "*/5 * * * *"
      - key: CORS_ORIGIN
        value: https://velozity-dashboard-two.vercel.app
