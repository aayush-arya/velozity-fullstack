services:
  - type: web
    name: velozity-dashboard-api
    runtime: node
    plan: free
    rootDir: backend
    # --include=dev: NODE_ENV=production (set below, for the running service)
    # also applies during the build, which makes a plain `npm install` skip
    # devDependencies - but @types/* and typescript itself live there, and
    # tsc needs them to compile. Nothing from devDependencies ends up in the
    # final dist/ output either way, so this only affects build time.
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render's free tier only allows one active free Postgres per account.
      # Rather than fight over that, this blueprint doesn't provision a
      # database - set DATABASE_URL yourself in the dashboard after the
      # service is created (your existing Render Postgres, or a free
      # instance from Neon/Supabase both work fine). See README > Deployment.
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 7d
      - key: REFRESH_TOKEN_COOKIE_NAME
        value: refresh_token
      - key: OVERDUE_CRON_SCHEDULE
        value: "*/5 * * * *"
      - key: CORS_ORIGIN
        value: https://velozity-dashboard-two.vercel.app
